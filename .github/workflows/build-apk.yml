name: Build GoldNX APK from ZIP

on:
workflow_dispatch:
push:
branches:
- main
- master

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Unzip source
    run: |
      unzip GoldNX_full_android_only_under100mb_v13.zip -d source
      ls -la source
      ls -la source/apps/android

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Make Gradle executable
    run: chmod +x source/apps/android/gradlew || true

  - name: Build APK
    working-directory: source/apps/android
    run: ./gradlew assembleDebug --stacktrace --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: goldnx-player-apk
      path: source/apps/android/app/build/outputs/apk/debug/*.apk
